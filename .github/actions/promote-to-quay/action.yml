name: Promote to Quay
description: |
  Promote a container image and/or Helm chart from Amazon ECR to Quay.io and sign with Cosign.
  At least one of `image` or `chart` must be provided.
author: Telicent

inputs:
  image:
    required: false
    description: The image name to promote (e.g. smart-cache-graph). Omit to skip image promotion.
  chart:
    required: false
    description: The Helm chart name to promote (e.g. graph). Omit to skip chart promotion.
  version:
    required: true
    description: The version to promote.
  role-to-assume:
    required: true
    description: The AWS IAM role to assume for tasks that require interaction with AWS, such as pushing a container image or Helm chart to ECR.
  quay-username:
    required: true
    description: Quay.io username.
  quay-token:
    required: true
    description: Quay.io token.
  quay-organisation:
    required: false
    default: telicent
    description: The Quay.io organisation to push to. Defaults to `telicent`.

  # SonarQube code health report options
  sonar-host-url:
    required: false
    default: https://sonarcloud.io
    description: Base URL of the SonarQube server used for the code health report.
  sonar-token:
    required: false
    description: |
      A SonarQube token with permission to browse the project, supplied from a secret. The code health report is
      only generated when this and `sonar-report-s3-uri` are both set, so repositories without SonarQube set up
      can simply omit them.
  sonar-project-key:
    required: false
    description: |
      The key of the SonarQube project to report on. Used as the fallback when `sonar.projectKey` cannot be read
      from `sonar-project-file`, so it is only required where the repository has no such file.
  sonar-project-file:
    required: false
    default: sonar-project.properties
    description: |
      Path to a SonarQube properties file, relative to the workspace, read for `sonar.projectKey`. A key found
      here takes precedence over `sonar-project-key`. Set to an empty string to skip the lookup, which also
      avoids the checkout this action would otherwise perform to read the file.
  sonar-branch:
    required: false
    description: The branch to report on. Defaults to the project's main branch when not specified.
  sonar-report-s3-uri:
    required: false
    description: |
      Destination for the code health report, for example `s3://my-bucket/reports/sonar/`. A URI ending in `/` is
      treated as a prefix and the generated file name is appended to it. The report is only generated when this
      and `sonar-token` are both set.
  sonar-report-aws-region:
    required: false
    default: eu-west-2
    description: AWS region used when uploading the code health report.
  sonar-report-aws-role:
    required: false
    description: |
      ARN of the AWS IAM role to assume in order to upload the code health report. Defaults to `role-to-assume`
      when not specified. The role needs `s3:PutObject` on `sonar-report-s3-uri`.
  sonar-fail-on-quality-gate:
    required: false
    default: "false"
    description: Whether to fail the job when the project's SonarQube quality gate is failing. The report is still generated and uploaded first.

outputs:
  image-digest:
    description: The digest of the image pushed to Quay.io. Empty if image promotion was skipped.
    value: ${{ steps.push-image.outputs.image-digest }}
  chart-ref:
    description: The digest-qualified chart reference pushed to Quay.io. Empty if chart promotion was skipped.
    value: ${{ steps.push-chart.outputs.chart-ref }}

runs:
  using: composite
  steps:
    ###
    # Dependency installation steps
    ###
    - name: Setup ORAS
      if: inputs.image != '' || inputs.chart != ''
      uses: oras-project/setup-oras@v1

    ###
    # Image promotion steps
    ###
    - name: Configure AWS credentials
      if: inputs.image != '' || inputs.chart != ''
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume != '' && inputs.role-to-assume || 'arn:aws:iam::098669589541:role/GitHubDeploymentRole' }}
        aws-region: eu-west-2
        mask-aws-account-id: true

    - name: Login to Amazon ECR
      if: inputs.image != '' || inputs.chart != ''
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: true

    - name: Login to Quay
      # Docker login to Quay is required for either image or chart promotion
      # because `cosign` requires access to the registry to push signatures.
      if: inputs.image != '' || inputs.chart != ''
      uses: docker/login-action@v4.1.0
      with:
        registry: quay.io
        username: ${{ inputs.quay-username }}
        password: ${{ inputs.quay-token }}

    - name: Copy container image from ECR to Quay
      if: inputs.image != ''
      id: push-image
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        QUAY_ORG: ${{ inputs.quay-organisation }}
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        TEMP_DIR: ${{ runner.temp }}
      run: |
        oras cp $ECR_REGISTRY/$IMAGE:$VERSION quay.io/$QUAY_ORG/$IMAGE:$VERSION 2>&1 | tee "${TEMP_DIR}/docker-push-output.txt"
        DIGEST=$(grep "^Digest" "${TEMP_DIR}/docker-push-output.txt" | awk '{print $NF}')
        [[ -n "$DIGEST" ]] || { echo "Failed to parse digest from oras output"; exit 1; }
        echo "image-digest=$DIGEST" >> "$GITHUB_OUTPUT"
        echo "image-ref=quay.io/$QUAY_ORG/$IMAGE:$VERSION@$DIGEST" >> "$GITHUB_OUTPUT"

    ###
    # Chart promotion steps
    ###

    # `oras` and `cosign` both of those authenticate via ~/.docker/config.json,
    # so there is no need to use `helm registry login` here.
    - name: Copy Helm chart from ECR to Quay
      if: inputs.chart != ''
      id: push-chart
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        QUAY_ORG: ${{ inputs.quay-organisation }}
        CHART: ${{ inputs.chart }}
        VERSION: ${{ inputs.version }}
        TEMP_DIR: ${{ runner.temp }}
      run: |
        oras cp $ECR_REGISTRY/charts/$CHART:$VERSION quay.io/$QUAY_ORG/charts/$CHART:$VERSION 2>&1 | tee "${TEMP_DIR}/helm-push-output.txt"
        DIGEST=$(grep "^Digest" "${TEMP_DIR}/helm-push-output.txt" | awk '{print $NF}')
        [[ -n "$DIGEST" ]] || { echo "Failed to parse digest from oras output"; exit 1; }
        echo "chart-ref=quay.io/$QUAY_ORG/charts/$CHART:$VERSION@$DIGEST" >> "$GITHUB_OUTPUT"
        echo "## Helm Push Summary" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cat "${TEMP_DIR}/helm-push-output.txt" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    ###
    # Image and chart signing steps
    ###
    - name: Install Cosign
      if: inputs.image != '' || inputs.chart != ''
      uses: sigstore/cosign-installer@v3

    - name: Sign image on Quay
      if: inputs.image != ''
      shell: bash
      env:
        IMAGE_REF: ${{ steps.push-image.outputs.image-ref }}
      run: cosign sign --yes "$IMAGE_REF"

    - name: Sign chart on Quay
      if: inputs.chart != ''
      shell: bash
      env:
        CHART_REF: ${{ steps.push-chart.outputs.chart-ref }}
      run: cosign sign --yes "$CHART_REF"

    ###
    # Code health reporting steps
    #
    # These run last because the report generation assumes its own AWS role for the S3 upload, which replaces
    # the credentials the promotion steps above rely on.
    ###

    # Promotion itself needs no source, so the repository is only checked out where the project key is to be
    # read from a properties file in it.
    - name: Checkout for the SonarQube project configuration
      if: inputs.sonar-token != '' && inputs.sonar-report-s3-uri != '' && inputs.sonar-project-file != ''
      uses: actions/checkout@v6.0.2

    - name: SonarQube code health report
      # Only run when the SonarQube token and report destination are supplied, so that repositories without
      # SonarQube set up are unaffected.
      if: inputs.sonar-token != '' && inputs.sonar-report-s3-uri != ''
      uses: telicent-oss/shared-workflows/.github/actions/sonar-report-generation@main
      with:
        sonar-host-url: ${{ inputs.sonar-host-url }}
        sonar-token: ${{ inputs.sonar-token }}
        sonar-project-key: ${{ inputs.sonar-project-key }}
        sonar-project-file: ${{ inputs.sonar-project-file }}
        sonar-branch: ${{ inputs.sonar-branch }}
        project-version: ${{ inputs.version }}
        s3-uri: ${{ inputs.sonar-report-s3-uri }}
        aws-region: ${{ inputs.sonar-report-aws-region }}
        aws-role-to-assume: ${{ inputs.sonar-report-aws-role != '' && inputs.sonar-report-aws-role || inputs.role-to-assume }}
        fail-on-quality-gate: ${{ inputs.sonar-fail-on-quality-gate }}
