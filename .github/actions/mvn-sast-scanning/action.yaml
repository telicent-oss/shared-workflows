name: SonarQube Maven Scan
description: |
  Runs SonarQube analysis for a Maven project via the SonarScanner for Maven (mvn sonar:sonar),
  optionally enforcing the Quality Gate as a hard failure.

  The caller is responsible for checking out the repository (with fetch-depth: 0 so Sonar can
  attribute new code correctly) and installing Java and Maven first.

  Per-project configuration lives in the consuming repository's pom.xml, which should pin
  org.sonarsource.scanner.maven:sonar-maven-plugin in pluginManagement and declare
  sonar.projectKey (plus sonar.organization for SonarQube Cloud) as properties.  Modules that
  should not be analysed (e.g. benchmarks) set the sonar.skip property.
author: Telicent
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  sonar-host-url:
    required: false
    default: https://sonarcloud.io
    description: Base URL of the SonarQube server used for the scan.
  sonar-token:
    required: true
    description: A SonarQube token with permission to analyse the project, supplied from a secret.
  compile:
    required: false
    default: auto
    description: |
      Whether to compile the project (mvn test-compile) before scanning, since the Sonar
      Java analyser requires compiled classes in target/classes:
      - "false": a build step already ran in this job (single-job workflows)
      - "true":  the scan runs in a fresh job (fan-in after a matrix build)
      - "auto":  compile if any module containing src/main/java has no target/classes directory.
        Errs towards compiling when in doubt; prefer an explicit "true"/"false" in fan-in
        workflows that download build output for only a subset of modules.
  coverage-report-paths:
    required: false
    default: ""
    description: |
      Value for sonar.coverage.jacoco.xmlReportPaths.  Leave empty when tests ran in this job,
      as the scanner's per-module default of target/site/jacoco/jacoco.xml applies.  When
      coverage was produced in other jobs and downloaded as artifacts, pass an absolute glob,
      e.g. "<pwd>/sonar-coverage/**/jacoco.xml"
  quality-gate:
    required: false
    default: ""
    description: |
      How the SonarQube Quality Gate is applied:
      - "enforce": wait for the Quality Gate and fail the build when it fails
      - "warn":    wait for the Quality Gate and report a failure as a warning and a job
                   summary entry, without failing the build
      - "off":     publish the analysis without waiting for the Quality Gate at all, so
                   no result is observed and nothing is reported

      Defaults to "warn" when neither this nor the deprecated 'fail-on-quality-gate'
      input is set, so that a caller which has not thought about gating gets the signal
      without having the build blocked by it.

      Note that "warn" only downgrades a genuine Quality Gate verdict.  A scan that
      fails before reaching the server (bad credentials, a compilation failure, a
      network problem) is a tooling failure rather than a verdict, and always fails the
      build regardless of this setting.
  fail-on-quality-gate:
    required: false
    default: ""
    description: |
      DEPRECATED - use 'quality-gate' instead.  "true" maps to quality-gate=enforce and
      "false" maps to quality-gate=off.  Note that "false" therefore means the Quality
      Gate result is never observed; use quality-gate=warn to keep the result visible
      without failing the build.
  quality-gate-timeout-seconds:
    required: false
    default: "300"
    description: Maximum time, in seconds, to wait for the Quality Gate result.
  maven-args:
    required: false
    default: ""
    description: Additional arguments to pass to the Maven invocations.
  maven-profiles:
    required: false
    default: "docker"
    description: Specifies the Maven profile(s) to activate (if needed)

outputs:
  dashboard-url:
    description: |
      URL of the analysis dashboard on the SonarQube server.  Emitted even when the Quality
      Gate fails, so callers can surface it in job summaries or PR comments.
    value: ${{ steps.scan.outputs.dashboard-url }}
  quality-gate-status:
    description: |
      The observed Quality Gate result, one of "PASSED", "FAILED" or "" (not observed,
      because quality-gate was "off" or the scan never reached the server).  Populated in
      "warn" mode as well as "enforce", so callers can route a non-blocking failure to a
      notification, a check run or a tracking issue.
    value: ${{ steps.scan.outputs.quality-gate-status }}

runs:
  using: composite
  steps:
    - name: Validate inputs and resolve the Quality Gate mode
      id: mode
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        GATE_TIMEOUT: ${{ inputs.quality-gate-timeout-seconds }}
        COMPILE: ${{ inputs.compile }}
        GATE_MODE: ${{ inputs.quality-gate }}
        FAIL_ON_GATE: ${{ inputs.fail-on-quality-gate }}
      run: |
        if [ -z "$SONAR_TOKEN" ]; then
          echo "::error::A SonarQube token must be provided using the 'sonar-token' input."
          exit 1
        fi
        if ! [[ "$GATE_TIMEOUT" =~ ^[0-9]+$ ]] || [ "$GATE_TIMEOUT" -le 0 ]; then
          echo "::error::'quality-gate-timeout-seconds' must be a positive whole number, got '$GATE_TIMEOUT'."
          exit 1
        fi
        # Unquoted YAML booleans reach the action as strings of unpredictable case,
        # hence the case-insensitive comparison here and in later steps
        case "$(echo "$COMPILE" | tr '[:upper:]' '[:lower:]')" in
          true|false|auto) ;;
          *)
            echo "::error::'compile' must be one of 'true', 'false' or 'auto', got '$COMPILE'."
            exit 1
            ;;
        esac
        # Resolve the Quality Gate mode.  'quality-gate' wins; the deprecated boolean is
        # honoured for callers that have not migrated yet; absent both, default to 'warn'
        # so gating is opt-in but the result is still reported.
        GATE_MODE="$(echo "$GATE_MODE" | tr '[:upper:]' '[:lower:]')"
        FAIL_ON_GATE="$(echo "$FAIL_ON_GATE" | tr '[:upper:]' '[:lower:]')"

        if [ -n "$GATE_MODE" ]; then
          if [ -n "$FAIL_ON_GATE" ]; then
            echo "::warning::Both 'quality-gate' and the deprecated 'fail-on-quality-gate' were supplied; 'quality-gate=$GATE_MODE' takes precedence."
          fi
        elif [ -n "$FAIL_ON_GATE" ]; then
          case "$FAIL_ON_GATE" in
            true)  GATE_MODE=enforce ;;
            false) GATE_MODE=off ;;
            *)
              echo "::error::'fail-on-quality-gate' must be 'true' or 'false', got '$FAIL_ON_GATE'."
              exit 1
              ;;
          esac
          echo "::warning::'fail-on-quality-gate' is deprecated; use 'quality-gate: $GATE_MODE' instead. Note that 'quality-gate: warn' reports a failing gate without blocking the build."
        else
          GATE_MODE=warn
        fi

        case "$GATE_MODE" in
          enforce|warn|off) ;;
          *)
            echo "::error::'quality-gate' must be one of 'enforce', 'warn' or 'off', got '$GATE_MODE'."
            exit 1
            ;;
        esac

        echo "Quality Gate mode: $GATE_MODE"
        echo "mode=$GATE_MODE" >> "$GITHUB_OUTPUT"

    - name: Compile project (if needed)
      shell: bash
      env:
        COMPILE: ${{ inputs.compile }}
        EXTRA_MAVEN_ARGS: ${{ inputs.maven-args }}
      run: |
        case "$(echo "$COMPILE" | tr '[:upper:]' '[:lower:]')" in
          true)  NEED_COMPILE=true ;;
          false) NEED_COMPILE=false ;;
          auto)
            # A missed module makes the scan fail or under-analyse, while a redundant compile
            # only costs time, so any module with sources but no classes triggers a compile
            NEED_COMPILE=false
            while IFS= read -r srcdir; do
              module="${srcdir%/src/main/java}"
              if [ ! -d "$module/target/classes" ]; then
                echo "::notice::compile=auto: '$module' has sources but no target/classes."
                NEED_COMPILE=true
                break
              fi
            done < <(find . -type d -path '*/src/main/java' -not -path '*/target/*')
            echo "::notice::compile=auto resolved to compile=$NEED_COMPILE"
            ;;
        esac
        if [ "$NEED_COMPILE" = "true" ]; then
          # Sonar's Java analyser needs bytecode, but tests are never rerun here, so coverage
          # must be supplied via the coverage-report-paths input in this scenario
          # Need to do a full package as some projects only build supplementary artifacts (which are also test 
          # dependencies) in the package phase
          mvn package -P${{ inputs.maven-profiles }} --batch-mode -DskipTests -Dgpg.skip -Dcyclonedx.skip \
            -Dmaven.javadoc.skip -Dmaven.source.skip -q $EXTRA_MAVEN_ARGS
        fi

    - name: SonarQube Analysis
      id: scan
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
        COVERAGE_PATHS: ${{ inputs.coverage-report-paths }}
        GATE_MODE: ${{ steps.mode.outputs.mode }}
        GATE_TIMEOUT: ${{ inputs.quality-gate-timeout-seconds }}
        EXTRA_MAVEN_ARGS: ${{ inputs.maven-args }}
      run: |
        # Waiting for the verdict is decided by whether we want to observe it, not by
        # whether we want to fail on it - 'warn' waits too, otherwise there would be
        # nothing to report.
        case "$GATE_MODE" in
          enforce|warn) WAIT=true ;;
          off)          WAIT=false ;;
        esac

        args=(sonar:sonar --batch-mode
              "-Dsonar.host.url=$SONAR_HOST_URL"
              "-Dsonar.qualitygate.wait=$WAIT"
              "-Dsonar.qualitygate.timeout=$GATE_TIMEOUT")
        if [ -n "$COVERAGE_PATHS" ]; then
          args+=("-Dsonar.coverage.jacoco.xmlReportPaths=$COVERAGE_PATHS")
        fi
        status=0
        mvn "${args[@]}" -P${{ inputs.maven-profiles }} $EXTRA_MAVEN_ARGS || status=$?

        # report-task.txt is only written once the scanner has successfully submitted the
        # analysis, so its presence is what separates a Quality Gate verdict from a
        # tooling failure below.
        REPORT=$(find . -path '*/target/sonar/report-task.txt' -print -quit)
        DASHBOARD=""
        if [ -n "$REPORT" ]; then
          DASHBOARD=$(grep '^dashboardUrl=' "$REPORT" | cut -d'=' -f2-)
          echo "dashboard-url=$DASHBOARD" >> "$GITHUB_OUTPUT"
        fi

        if [ "$status" -eq 0 ]; then
          if [ "$WAIT" = "true" ]; then
            echo "quality-gate-status=PASSED" >> "$GITHUB_OUTPUT"
            echo "The SonarQube Quality Gate passed."
          else
            echo "quality-gate-status=" >> "$GITHUB_OUTPUT"
            echo "::notice::Analysis published without waiting for the Quality Gate (quality-gate=off)."
          fi
          exit 0
        fi

        # The scan never reached the server, so this is a tooling failure and not a
        # verdict.  Fail regardless of mode - 'warn' must not hide a broken scan.
        if [ -z "$REPORT" ]; then
          echo "quality-gate-status=" >> "$GITHUB_OUTPUT"
          echo "::error::SonarQube analysis failed before reaching the server, so no Quality Gate result was produced. This is a scan failure rather than a code quality result and fails the build in every mode."
          exit $status
        fi

        echo "quality-gate-status=FAILED" >> "$GITHUB_OUTPUT"

        # Note that a Quality Gate that did not resolve within
        # quality-gate-timeout-seconds is indistinguishable from one that failed at this
        # point, so a slow analysis queue reports as a failure.  Pre-existing behaviour,
        # but it is a reason to prefer 'warn' on refs that must not be blocked.
        if [ "$GATE_MODE" = "warn" ]; then
          echo "::warning::The SonarQube Quality Gate failed or did not resolve in time. It is not enforced on '${GITHUB_REF_NAME}', so the build has not been failed. $DASHBOARD"
          {
            echo "### :warning: SonarQube Quality Gate failed"
            echo
            echo "The Quality Gate is reported but not enforced on \`${GITHUB_REF_NAME}\`, so this has not failed the build."
            if [ -n "$DASHBOARD" ]; then
              echo
              echo "[View the analysis]($DASHBOARD)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        echo "::error::The SonarQube Quality Gate failed. $DASHBOARD"
        exit $status