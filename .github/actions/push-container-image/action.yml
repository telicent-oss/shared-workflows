name: Build and Push Container Image
description: Build, tag and push a container image to the selected container repository
author: Telicent

inputs:
  app-name:
    required: true
    description: The name for the application, used as the main portion of the image name.
  app-name-prefix:
    required: false
    default: telicent-
    description: The prefix for the image name. Defaults to `telicent-`.
  dry-run:
    required: false
    default: "false"
    description: Whether to test the build and scan without pushing to the registry.
  github-token:
    required: true
    description: GitHub token to allow the action to interact with the repository.

  # Application build options
  enable-buildkit-cache:
    required: false
    default: "false"
    description: Whether the docker buildkit cache is required.
  java-version:
    required: false
    default: "21"
    description: Specifies the JDK version to install and build with.  Defaults to 21.
  jdk:
    required: false
    default: temurin
    description: Specifies the JDK to use, defaults to temurin.
  package-directory:
    required: false
    default: .
    description: If release has multiple package that are SBOM targets, then set this to disambiguate SBOMs.
  download-sbom:
    required: false
    default: "true"
    description: Whether to attempt to download a previously uploaded SBOM artifact for use in the image build.
  uses-maven:
    required: false
    default: "false"
    description: Whether your build requires the JDK and Maven to be present.

  # CodeArtifact options (only used by `uses-maven`)
  codeartifact-role:
    required: false
    description: |
      ARN of the AWS IAM role to assume in order to obtain an AWS CodeArtifact token so that a
      `uses-maven` build can resolve private Maven dependencies. When omitted no CodeArtifact login is
      performed and dependencies must be resolvable from public repositories or the restored Maven cache
      (this preserves the previous behaviour).
  codeartifact-domain:
    required: false
    default: telicent
    description: The AWS CodeArtifact domain used when obtaining a token. Only used when `codeartifact-role` is set.
  codeartifact-domain-owner:
    required: false
    description: |
      The AWS account ID that owns the CodeArtifact domain. Intentionally not defaulted so that an AWS account
      number is not embedded in this OSS action — pass it from a secret in the calling workflow, e.g.
      `secrets.AWS_ACCOUNT_ID`. Required when `codeartifact-role` is set.
  codeartifact-repository-id:
    required: false
    default: aws-codeartifact-telicent
    description: |
      The Maven server id that matches the CodeArtifact repository declared in your pom.xml
      (`<repository>`/`<distributionManagement>`). The obtained token is associated with this server id so
      that Maven authenticates correctly against that repository. Only used when `codeartifact-role` is set.
  codeartifact-token-lifetime:
    required: false
    default: "3600"
    description: Lifetime (in seconds) of the AWS CodeArtifact token. Only used when `codeartifact-role` is set.

  # Container registry options
  registry:
    required: true
    description: The container registry to push the image to. Supported values are `aws` (Amazon ECR) or `quay` (Quay.io).
  quay-username:
    required: false
    description: Quay username. Required if registry is set to `quay`.
  quay-token:
    required: false
    description: Quay token. Required if registry is set to `quay`.
  role-to-assume:
    required: true
    description: The AWS IAM role to assume for tasks that require interaction with AWS, such as pushing a container image or Helm chart to ECR.

  # Container build and tag options
  allow-latest-tag:
    required: false
    default: "false"
    description: |
      Set to `true` to explicitly add the `latest` tag.
      The tag may still be added implicitly if `allow-mutable-tags` is set to `true` and the reference branch is the branch specified as `main-branch`.
  allow-development-tag:
    required: false
    default: "false"
    description: |
      Set to `true` to explicitly add the `development` tag.
      The tag may still be added implicitly if `allow-mutable-tags` is set to `true` and the reference branch is differs from the branch specified as `main-branch`.
  allow-mutable-tags:
    required: false
    default: "true"
    description: Set to `false` to avoid adding mutable tags like `latest` and `development` based on the branch specified as `main-branch`.
  allow-sha-tag:
    required: false
    default: "true"
    description: Set to `false` to avoid adding the image SHA as a tag.
  allow-version-tag:
    required: false
    default: "true"
    description: Set to `false` to avoid adding a version tag.
  build-args:
    required: false
    description: Additional build arguments to pass to the Docker --build-arg flag.
  sha-tag-format:
    required: false
    default: long
    description: |
      The format to use when tagging the image with the git SHA.
      Must be one of `long` (default, 40 character SHA) or `short` (7 character SHA).
      The environment variable `DOCKER_METADATA_SHORT_SHA_LENGTH` can be used to change the short SHA length.
  build-artifact:
    required: false
    description: Artifact used as part of the Docker build.
  dockerfile:
    required: false
    default: Dockerfile
    description: The name of the Dockerfile to build the image from.
  image-suffix:
    required: false
    description: Optional suffix used as part of the image name.
  main-branch:
    required: false
    default: main
    description: |
      Specifies the main branch for the repository, defaults to main.  If this build is on the configured main
      branch then the latest tag will be added to the image, if the build is on another branch then the development
      tag will be added to the image (only with `ALLOW_MUTABLE_TAGS` for both).
  path:
    description: The path in which the Dockerfile is located. For current path leave empty. Otherwise eg. ./frontend
    default: .
  target:
    required: false
    description: The build target within the Dockerfile to build the image from.
  version:
    required: false
    description: The version for the image, used in tagging the image.
  version-suffix:
    required: false
    description: Optional suffix for the version of the image, used in tagging the image.

  # SonarQube code health report options
  sonar-host-url:
    required: false
    default: https://sonarcloud.io
    description: Base URL of the SonarQube server used for the code health report. Only used when `registry` is `quay`.
  sonar-token:
    required: false
    description: |
      A SonarQube token with permission to browse the project, supplied from a secret. The code health report is
      only generated when this and `sonar-report-s3-uri` are both set, and the registry is `quay`.
  sonar-project-key:
    required: false
    description: |
      The key of the SonarQube project to report on. Used as the fallback when `sonar.projectKey` cannot be read
      from `sonar-project-file`, so it is only required where the repository has no such file.
  sonar-project-file:
    required: false
    default: sonar-project.properties
    description: |
      Path to a SonarQube properties file, relative to the workspace, read for `sonar.projectKey`. A key found
      here takes precedence over `sonar-project-key`. Set to an empty string to skip the lookup.
  sonar-branch:
    required: false
    description: The branch to report on. Defaults to the project's main branch when not specified.
  sonar-report-s3-uri:
    required: false
    description: |
      Destination for the code health report, for example `s3://my-bucket/reports/sonar/`. A URI ending in `/` is
      treated as a prefix and the generated file name is appended to it. The report is only generated when this
      and `sonar-token` are both set, and the registry is `quay`.
  sonar-report-aws-region:
    required: false
    default: eu-west-2
    description: AWS region used when uploading the code health report.
  sonar-report-aws-role:
    required: false
    description: |
      ARN of the AWS IAM role to assume in order to upload the code health report. Defaults to `role-to-assume`
      when not specified. The role needs `s3:PutObject` on `sonar-report-s3-uri`.
  sonar-fail-on-quality-gate:
    required: false
    default: "false"
    description: Whether to fail the job when the project's SonarQube quality gate is failing. The report is still generated and uploaded first.

  # MS Teams notification options
  teams-webhook-url:
    required: false
    description: MS Teams webhook or workflow URL to send notifications to.

  # Trivy/Grype scanning options
  grype-scan-image:
    required: false
    default: "true"
    description: Whether to run a Grype scan on the built image.
  trivy-ignores:
    required: false
    description: Name of trivy ignore file. Only allowed for BUILD image, MUST NOT be used with DEPLOY images.
  trivy-scan-dockerfile:
    required: false
    default: "true"
    description: Whether to run a Trivy scan on the Dockerfile used to build the image.
  trivy-scan-image:
    required: false
    default: "true"
    description: Whether to run a Trivy scan on the built image.
  fail-on-unfixed:
    required: false
    default: "false"
    description: Whether to fail the scan if unfixed vulnerabilities are found.
  remote-vex:
    required: false
    description: |
      Supplies references to one/more repositories from which additional VEX statements should be obtained and used
      to filter out vulnerabilities that have been assessed as to not apply to our software products.
      Note that telicent-oss/telicent-base-images is always included by default so this is only needed if the image
      being built relies on other images/libraries for which VEX statements are required.

  # Build secrets
  font-awesome-key:
    required: false
    description: NPM Font Awesome token.
  package-pat:
    required: false
    description: NPM package feed token.
outputs:
  image:
    description: The versioned container image tag that was created and published.
    value: ${{ steps.capture-tags.outputs.image }}
  sha-image-tag:
    description: The git revision (SAH) applied as a tag to the container image, if applicable.
    value: ${{ steps.output-sha-image-tag.outputs.sha-image-tag }}

runs:
  using: composite
  steps:
    - name: Validate registry inputs
      uses: telicent-oss/shared-workflows/.github/actions/validate-registry-inputs@main
      with:
        registry: "${{ inputs.registry }}"
        quay-username: "${{ inputs.quay-username }}"
        quay-token: "${{ inputs.quay-token }}"

    # Set some globals, as environment variables are not allowed in composite actions
    - name: Set globals
      id: globals
      run: ${{ github.action_path }}/globals.sh
      shell: bash
      env:
        BOM_ARTIFACT_NAME: "${{ github.run_number }}${{ inputs.package-directory != '.' && format('-{0}', inputs.package-directory) || '' }}.sbom.json"

    - name: Checkout
      uses: actions/checkout@v6.0.2

    # When a CodeArtifact role is supplied, configure Maven with a server entry for the CodeArtifact
    # repository. The credentials reference environment variables that are populated by the CodeArtifact
    # login step below at the time the Maven build runs.
    - name: Install Java and Maven (with CodeArtifact)
      if: inputs.uses-maven == 'true' && inputs.codeartifact-role != ''
      uses: actions/setup-java@v5.2.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.jdk }}
        cache: maven
        server-id: ${{ inputs.codeartifact-repository-id }}
        server-username: AWS_CODEARTIFACT_USER
        server-password: AWS_CODEARTIFACT_TOKEN

    - name: Install Java and Maven
      if: inputs.uses-maven == 'true' && inputs.codeartifact-role == ''
      uses: actions/setup-java@v5.2.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.jdk }}
        cache: maven

    # Obtain a short-lived AWS CodeArtifact token so the Maven build can resolve private dependencies.
    # Only runs when a CodeArtifact role ARN is supplied. The main-account credentials required for ECR
    # are configured later, after the Maven build, so assuming the CodeArtifact role here is safe.
    - name: Configure AWS credentials for CodeArtifact
      if: inputs.uses-maven == 'true' && inputs.codeartifact-role != ''
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.codeartifact-role }}
        aws-region: eu-west-2
        mask-aws-account-id: true

    - name: AWS CodeArtifact Login
      id: codeartifact-login
      if: inputs.uses-maven == 'true' && inputs.codeartifact-role != ''
      uses: telicent-oss/shared-workflows/.github/actions/aws-codeartifact-login@main
      with:
        domain: ${{ inputs.codeartifact-domain }}
        owner: ${{ inputs.codeartifact-domain-owner }}
        token-lifetime: ${{ inputs.codeartifact-token-lifetime }}

    # NB - When no CodeArtifact role is supplied the assumption is that this action has been called after
    #      the Maven workflow, so the restored Maven cache already contains all dependencies and tests have
    #      already passed. Supplying `codeartifact-role` makes private dependency resolution robust to
    #      cache misses (for example after a dependency version bump changes the cache key).
    - name: Quick Maven Build
      if: inputs.uses-maven == 'true'
      run: mvn package -U --batch-mode -DskipTests
      shell: bash
      env:
        AWS_CODEARTIFACT_USER: ${{ steps.codeartifact-login.outputs.user }}
        AWS_CODEARTIFACT_TOKEN: ${{ steps.codeartifact-login.outputs.token }}

    - name: Download build artifact
      uses: actions/download-artifact@v8
      if: inputs.build-artifact
      with:
        name: ${{ inputs.build-artifact }}
        path: ${{ inputs.build-artifact }}/

    - name: Get SBOM from artifact
      uses: actions/download-artifact@v8
      if: ${{ inputs.download-sbom == 'true' }}
      # Allow to continue even if SBOM is not found
      continue-on-error: true
      with:
        name: ${{ steps.globals.outputs.bom-artifact-name }}
        path: ${{ inputs.PATH }}

    - name: Configure AWS credentials from main account
      id: aws-login
      # Only run if dry run is explicitly set to 'false'
      if: inputs.registry == 'aws' && inputs.dry-run == 'false'
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume != '' && inputs.role-to-assume || 'arn:aws:iam::098669589541:role/GitHubDeploymentRole' }}
        aws-region: eu-west-2
        mask-aws-account-id: true

    - name: Docker Login to Amazon ECR
      # Only run if dry run is explicitly set to 'false'
      if: inputs.registry == 'aws' && inputs.dry-run == 'false'
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: true

    - name: Docker Login to Quay
      # Only run if dry run is explicitly set to 'false'
      # Dependabot triggered PRs don't have access to Quay credentials to push images, so no need to run in this case either
      if: inputs.registry == 'quay' && inputs.dry-run == 'false' && github.actor != 'dependabot[bot]'
      uses: docker/login-action@v4.1.0
      with:
        registry: quay.io
        username: ${{ inputs.quay-username }}
        password: ${{ inputs.quay-token }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.0.0
      with:
        platforms: all

    - name: Set up Docker buildx
      id: buildx
      uses: docker/setup-buildx-action@v4.0.0

    - name: Enable buildkit cache
      # Must run after buildx setup: the loader below needs the builder container to exist
      # and resolves its name from the buildx step's outputs
      uses: actions/cache@v5.0.5
      if: inputs.enable-buildkit-cache == 'true'
      with:
        path: /tmp/buildkit-cache/buildkit-state.tar
        key: ${{ runner.os }}-buildkit-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildkit-

    - name: Load buildkit state from cache
      uses: dashevo/gh-action-cache-buildkit-state@v1.0.3
      if: inputs.enable-buildkit-cache == 'true'
      with:
        builder: buildx_buildkit_${{ steps.buildx.outputs.name }}0
        cache-path: /tmp/buildkit-cache
        cache-max-size: 3g

    - name: Prepare Docker image names and tags
      id: meta
      uses: docker/metadata-action@v6.0.0
      with:
        # Defines the base image names in repository/name format
        images: |
          ${{ env.AWS_REGISTRY }}${{ env.QUAY_REGISTRY }}${{ env.IMAGE_NAME }}
        # Manually handling latest below so disabling automatic latest handling
        flavor: |
          latest=false
        # Why use `prefix=sha` with the `sha` tag? Because of a semver edge case. See 'SHA Tag Prefix' in the README for details.
        tags: |
          type=ref,event=tag
          type=sha,prefix=sha,format=${{ inputs.sha-tag-format }},enable=${{ inputs.allow-sha-tag == 'true' }}
          type=raw,value=${{ inputs.version }}${{ inputs.version-suffix }},enable=${{ inputs.allow-version-tag == 'true' }}
          type=raw,value=latest,enable=${{ env.TAG_LATEST }}
          type=raw,value=development,enable=${{ env.TAG_DEVELOPMENT }}
      env:
        # During a dry-run the ECR login step is skipped, so its `registry` output is empty. Without the
        # dry-run guard this would evaluate to `format('{0}/', '')` = "/", producing malformed tags like
        # `/name:development`. Dry-runs never push, so an empty prefix is correct here.
        AWS_REGISTRY: ${{ inputs.registry == 'aws' && inputs.dry-run == 'false' && format('{0}/', steps.login-ecr.outputs.registry) || '' }}
        QUAY_REGISTRY: ${{ inputs.registry == 'quay' && 'quay.io/telicent/' || '' }}
        IMAGE_NAME: ${{ inputs.app-name-prefix }}${{ inputs.app-name }}${{ inputs.image-suffix }}
        TAG_DEVELOPMENT: ${{ inputs.allow-development-tag == 'true' || (inputs.allow-mutable-tags == 'true' && github.ref_name != inputs.main-branch) }}
        TAG_LATEST: ${{ inputs.allow-latest-tag == 'true' || (inputs.allow-mutable-tags == 'true' && github.ref_name == inputs.main-branch) }}

    - name: Output SHA image tag
      id: output-sha-image-tag
      shell: bash
      run: |
        jq '.' <<< "$DOCKER_METADATA"
        SHA_IMAGE_TAG=$(echo "$DOCKER_METADATA" | jq -r '."tag-names"[] | select(. | test("[a-f0-9]{7,40}"))')
        echo "sha-image-tag=$SHA_IMAGE_TAG" >> $GITHUB_OUTPUT && echo "SHA_IMAGE_TAG=$SHA_IMAGE_TAG"
      env:
        DOCKER_METADATA: ${{ steps.meta.outputs.json}}

    - name: Build container image
      # Only run if dry run is explicitly set to 'false'.
      # Builds the multi-platform image WITHOUT pushing it, so that the image scans below can
      # gate the push. The 'Push container image' step re-runs this build as a pure cache hit
      # (same builder, same inputs), so nothing is rebuilt when the image is eventually pushed.
      id: build-image
      uses: docker/build-push-action@v7.1.0
      if: inputs.dry-run == 'false'
      env:
        DOCKER_BUILDKIT: 1
      with:
        builder: ${{ steps.buildx.outputs.name }}
        platforms: linux/amd64,linux/arm64
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
        context: ${{ inputs.path }}
        file: ${{ inputs.path }}/${{ inputs.dockerfile }}
        tags: ${{ steps.meta.outputs.tags }}
        target: ${{ inputs.target }}
        secrets: |
          ${{ inputs.package-pat && inputs.package-pat || '' }}
          ${{ inputs.font-awesome-key && inputs.font-awesome-key || '' }}
        build-args: |
          ${{ inputs.build-args }}

    - name: Build container image tarball for scanning
      # Only run if this is a dry run or at least one image scan is enabled.
      # The default image store in Docker Engine doesn't support loading multi-platform images,
      # so a single (native platform) tarball is exported for the local scans. This is a pure
      # cache hit against the build above.
      id: build-image-tarball
      uses: docker/build-push-action@v7.1.0
      if: inputs.dry-run != 'false' || inputs.trivy-scan-image == 'true' || inputs.grype-scan-image == 'true'
      env:
        DOCKER_BUILDKIT: 1
      with:
        builder: ${{ steps.buildx.outputs.name }}
        push: false
        cache-from: type=gha
        cache-to: type=gha,mode=max
        context: ${{ inputs.path }}
        file: ${{ inputs.path }}/${{ inputs.dockerfile }}
        tags: ${{ steps.meta.outputs.tags }}
        target: ${{ inputs.target }}
        secrets: |
          ${{ inputs.package-pat && inputs.package-pat || '' }}
          ${{ inputs.font-awesome-key && inputs.font-awesome-key || '' }}
        build-args: |
          ${{ inputs.build-args }}
        outputs: type=docker,dest=/tmp/${{ inputs.app-name-prefix }}${{ inputs.app-name }}${{ inputs.image-suffix }}-${{ inputs.dockerfile }}.tar

    - name: Upload container image tarball artefact
      # The artefact name must match '<scan-name>.tar' as the scan actions download it by that name
      id: upload-image-artefact
      uses: actions/upload-artifact@v7
      if: inputs.dry-run != 'false' || inputs.trivy-scan-image == 'true' || inputs.grype-scan-image == 'true'
      with:
        name: ${{ inputs.app-name-prefix }}${{ inputs.app-name }}${{ inputs.image-suffix }}-${{ inputs.dockerfile }}.tar
        path: /tmp/${{ inputs.app-name-prefix }}${{ inputs.app-name }}${{ inputs.image-suffix }}-${{ inputs.dockerfile }}.tar
        if-no-files-found: error

    - name: Capture built container image tags
      id: capture-tags
      run: ${{ github.action_path }}/capture-tags.sh
      shell: bash
      env:
        REGISTRY: "${{ inputs.registry }}"
        # Empty during a dry-run (ECR login is skipped); capture-tags.sh then omits the registry prefix.
        AWS_REGISTRY_URL: "${{ inputs.dry-run == 'false' && steps.login-ecr.outputs.registry || '' }}"
        QUAY_REGISTRY_URL: "quay.io/telicent"
        IMAGE_NAME: "${{ inputs.app-name-prefix }}${{ inputs.app-name }}${{ inputs.image-suffix }}"
        IMAGE_VERSION: "${{ steps.meta.outputs.version }}"

    - name: Trivy dockerfile scan
      # Only run if Trivy dockerfile scan is explicitly set to 'true'
      if: inputs.trivy-scan-dockerfile == 'true'
      uses: telicent-oss/shared-workflows/.github/actions/trivy-dockerfile-scan@main
      with:
        dockerfile: ${{ inputs.path }}/${{ inputs.dockerfile }}
        github-token: ${{ inputs.github-token }}
        scan-name: ${{ inputs.app-name-prefix }}${{ inputs.app-name }}${{ inputs.image-suffix }}-${{ inputs.dockerfile }}

    - name: Trivy image scan
      # Only run if Trivy image scan is explicitly set to 'true'
      if: inputs.trivy-scan-image == 'true'
      uses: telicent-oss/shared-workflows/.github/actions/trivy-image-scan@main
      with:
        github-token: ${{ inputs.github-token }}
        # The image is always scanned locally from the tarball artefact, before it is pushed
        image-from-artefact: 'true'
        image-ref: ${{ steps.capture-tags.outputs.image }}
        registry: ${{ inputs.registry }}
        quay-username: ${{ inputs.quay-username }}
        quay-token: ${{ inputs.quay-token }}
        scan-name: ${{ inputs.app-name-prefix }}${{ inputs.app-name }}${{ inputs.image-suffix }}-${{ inputs.dockerfile }}
        fail-on-unfixed: ${{ inputs.fail-on-unfixed }}
        remote-vex: ${{ inputs.remote-vex }}
        trivy-ignores: ${{ inputs.trivy-ignores != '' && format('{0}/{1}', inputs.package-directory, inputs.trivy-ignores) || '' }}
        uses-java: ${{ inputs.uses-maven }}

    - name: Grype image scan
      # Only run if Grype image scan is explicitly set to 'true'
      if: inputs.grype-scan-image == 'true'
      uses: telicent-oss/shared-workflows/.github/actions/grype-image-scan@main
      with:
        github-token: ${{ inputs.github-token }}
        # The image is always scanned locally from the tarball artefact, before it is pushed
        image-from-artefact: 'true'
        image-ref: ${{ steps.capture-tags.outputs.image }}
        registry: ${{ inputs.registry }}
        quay-username: ${{ inputs.quay-username }}
        quay-token: ${{ inputs.quay-token }}
        role-to-assume: ${{ inputs.role-to-assume }}
        scan-name: ${{ inputs.app-name-prefix }}${{ inputs.app-name }}${{ inputs.image-suffix }}-${{ inputs.dockerfile }}
        fail-on-unfixed: ${{ inputs.fail-on-unfixed }}
        remote-vex: ${{ inputs.remote-vex }}

    - name: Push container image
      # Only run if dry run is explicitly set to 'false', and only once the image scans above
      # have passed. Re-runs the 'Build container image' build as a pure cache hit, so this
      # step only generates the provenance/SBOM attestations and pushes the already built image.
      id: build-images
      uses: docker/build-push-action@v7.1.0
      if: inputs.dry-run == 'false'
      env:
        DOCKER_BUILDKIT: 1
      with:
        builder: ${{ steps.buildx.outputs.name }}
        platforms: linux/amd64,linux/arm64
        # Dependabot triggered PRs don't have access to Quay credentials to push images
        push: ${{ ! (inputs.registry == 'quay' && github.actor == 'dependabot[bot]') }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        context: ${{ inputs.path }}
        file: ${{ inputs.path }}/${{ inputs.dockerfile }}
        provenance: mode=max
        tags: ${{ steps.meta.outputs.tags }}
        target: ${{ inputs.target }}
        sbom: true
        secrets: |
          ${{ inputs.package-pat && inputs.package-pat || '' }}
          ${{ inputs.font-awesome-key && inputs.font-awesome-key || '' }}
        build-args: |
          ${{ inputs.build-args }}

    - name: Install CoSign
      # Only run if dry run is explicitly set to 'false' and the image is being pushed to 'quay'.
      if: inputs.dry-run == 'false' && inputs.registry == 'quay'
      uses: sigstore/cosign-installer@v3
    - name: Sign charts on Quay.io
      # Only run if dry run is explicitly set to 'false' and the image is being pushed to 'quay'.
      if: inputs.dry-run == 'false' && inputs.registry == 'quay'
      shell: bash
      env:
        DIGEST: ${{ steps.build-images.outputs.digest }}
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
    - name: SonarQube code health report
      # Only run when actually pushing to Quay, and only when the SonarQube token and report destination are
      # supplied. Dry runs are skipped so that they remain free of side effects.
      if: inputs.registry == 'quay' && inputs.dry-run == 'false' && inputs.sonar-token != '' && inputs.sonar-report-s3-uri != ''
      uses: telicent-oss/shared-workflows/.github/actions/sonar-report-generation@main
      with:
        sonar-host-url: ${{ inputs.sonar-host-url }}
        sonar-token: ${{ inputs.sonar-token }}
        sonar-project-key: ${{ inputs.sonar-project-key }}
        sonar-project-file: ${{ inputs.sonar-project-file }}
        sonar-branch: ${{ inputs.sonar-branch }}
        project-version: ${{ inputs.version }}${{ inputs.version-suffix }}
        s3-uri: ${{ inputs.sonar-report-s3-uri }}
        aws-region: ${{ inputs.sonar-report-aws-region }}
        aws-role-to-assume: ${{ inputs.sonar-report-aws-role != '' && inputs.sonar-report-aws-role || inputs.role-to-assume }}
        fail-on-quality-gate: ${{ inputs.sonar-fail-on-quality-gate }}

    - name: Notify MS Teams of image push
      if: inputs.teams-webhook-url != ''
      uses: telicent-oss/shared-workflows/.github/actions/notify-teams@main
      with:
        app-name: ${{ inputs.app-name}}
        notification-type: image-push
        teams-webhook-url: ${{ inputs.teams-webhook-url }}
        image-url: ${{ steps.capture-tags.outputs.image }}
        registry: ${{ inputs.registry == 'quay' && 'Quay.io' || inputs.registry == 'aws' && 'ECR' || '' }}
        status: ${{ steps.build-images.outcome }}
