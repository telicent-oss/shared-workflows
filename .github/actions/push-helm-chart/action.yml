name: Package and Push Helm Chart
description: |
  Package and push a Helm chart to the selected Helm repository.
  Optionally update the chart version and app version prior to packaging.
author: Telicent
inputs:
  app-name:
    required: true
    description: The name for the application, used as the main portion of the Helm chart name.
  app-name-prefix:
    required: false
    default: telicent-
    description: The prefix for the Helm chart name. Defaults to `telicent-`.
  chart:
    required: true
    description: Path to the Helm chart to package and push, relative to the repository root.
  dry-run:
    required: false
    default: "false"
    description: Whether to test the build and scan without pushing to the registry.
  sparse-checkout:
    required: false
    default: ""
    description: "Specify files to include in sparse-checkout, defaults to just the chart name"

  # Container registry options
  registry:
    required: true
    description: The container registry to push the image to. Supported values are `aws` (Amazon ECR) or `quay` (Quay.io).
  quay-username:
    required: false
    description: Quay username. Required if registry is set to `quay`.
  quay-token:
    required: false
    description: Quay token. Required if registry is set to `quay`.
  role-to-assume:
    required: true
    description: The AWS IAM role to assume for tasks that require interaction with AWS, such as pushing a container image or Helm chart to ECR.

  # Chart packaging options
  version:
    required: true
    description: The version of the chart.
  appVersion:
    required: false
    description: |
      The app version to apply to the Chart.yaml when packaging the Helm chart.
      Ignored if `replace-chart-versions` is not `true`.
  replace-chart-versions:
    required: false
    default: "false"
    description: Whether the `version`` and `appVersion` values should be used to update Chart.yaml when packaging the Helm chart.
  use-build-number:
    required: false
    default: "false"
    description: |
      Set to `true` to version the chart <next-version>-<build-number> via the resolve-dev-version action, so Kargo
      can order dev builds by semver. `version` becomes the fallback when no release-please PR is open, and the
      chart versions are replaced as if `replace-chart-versions` were `true`. Only allowed with `registry: aws`.
      Needs `contents: read` and `pull-requests: read`.
  release-please-component:
    required: false
    default: ""
    description: With `use-build-number`, the release-please component whose release PR gives the next version.
  release-tag-pattern:
    required: false
    default: "v*"
    description: With `use-build-number`, the glob matching release tags, from which build numbers are counted.

outputs:
  version:
    description: The version the chart was packaged with.
    value: ${{ steps.chart-version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Refuse build numbers outside ECR
      if: inputs.use-build-number == 'true' && inputs.registry != 'aws'
      shell: bash
      run: |
        echo "::error::use-build-number is for dev charts on ECR; release charts keep their release version"
        exit 1
    - name: Validate registry inputs
      uses: telicent-oss/shared-workflows/.github/actions/validate-registry-inputs@main
      with:
        registry: "${{ inputs.registry }}"
        quay-username: "${{ inputs.quay-username }}"
        quay-token: "${{ inputs.quay-token }}"
    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: "latest"
    - name: Checkout Helm chart
      uses: actions/checkout@v6
      with:
        sparse-checkout: ${{ inputs.sparse-checkout != '' && inputs.sparse-checkout || inputs.chart }}
        sparse-checkout-cone-mode: false
    - name: Resolve build-numbered version
      if: inputs.use-build-number == 'true'
      id: dev-version
      uses: telicent-oss/shared-workflows/.github/actions/resolve-dev-version@main
      with:
        current-version: ${{ inputs.version }}
        component: ${{ inputs.release-please-component }}
        tag-pattern: ${{ inputs.release-tag-pattern }}
    - name: Set chart version
      id: chart-version
      shell: bash
      run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      env:
        VERSION: ${{ steps.dev-version.outputs.version || inputs.version }}
    - name: Package Helm chart
      shell: bash
      run: |
        echo "Packaging ${{ inputs.chart }}"
        if [[ "${{ inputs.replace-chart-versions == 'true' || inputs.use-build-number == 'true' }}" == 'true' ]]; then
          echo "  🔄 Updating chart version and app version to $VERSION"
          helm package "${{ inputs.chart }}" --destination "${{ runner.temp }}/packaged-chart/" \
            --version "$VERSION" \
            --app-version "${{ inputs.appVersion != '' && inputs.appVersion || steps.chart-version.outputs.version }}"
        else
          helm package "${{ inputs.chart }}" --destination "${{ runner.temp }}/packaged-chart/"
        fi
      env:
        VERSION: ${{ steps.chart-version.outputs.version }}

    ###
    # Steps if action is a dry run, i.e. the Helm chart should not be pushed
    ###
    - name: Upload container image tarball artefact
      # Only run if dry run is set to anything other than 'false', indicating that this is a dry run
      id: upload-image-artefact
      uses: actions/upload-artifact@v7
      if: inputs.dry-run != 'false'
      with:
        name: ${{ inputs.app-name-prefix }}${{ inputs.app-name }}.tar
        path: /tmp/${{ inputs.app-name-prefix }}${{ inputs.app-name }}.tar

    ###
    # Steps if action is not a dry run, i.e. the Helm chart should actually be pushed
    ###
    - name: Configure AWS credentials from main account
      # Only run if dry run is explicitly set to 'false'
      if: inputs.registry == 'aws' && inputs.dry-run == 'false'
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume != '' && inputs.role-to-assume || 'arn:aws:iam::098669589541:role/GitHubDeploymentRole' }}
        aws-region: eu-west-2
        mask-aws-account-id: true
    - name: Docker Login to Amazon ECR
      # Only run if dry run is explicitly set to 'false'
      if: inputs.registry == 'aws' && inputs.dry-run == 'false'
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        mask-password: true
    - name: Log in to Quay.io (Helm)
      # Only run if dry run is explicitly set to 'false'
      # Dependabot triggered PRs don't have access to Quay credentials to push images, so no need to run in this case either
      if: inputs.registry == 'quay' && inputs.dry-run == 'false' && github.actor != 'dependabot[bot]'
      shell: bash
      run: |
        echo "$QUAY_TOKEN" | helm registry login quay.io --username "$QUAY_USERNAME" --password-stdin
      env:
        QUAY_USERNAME: ${{ inputs.quay-username }}
        QUAY_TOKEN: ${{ inputs.quay-token }}
    - name: Docker Login to Quay.io (CoSign)
      # Helm's registry login stores credentials separately from Docker's, so a Docker login is also required.
      # Only run if dry run is explicitly set to 'false'
      # Dependabot triggered PRs don't have access to Quay credentials to push images, so no need to run in this case either
      if: inputs.registry == 'quay' && inputs.dry-run == 'false' && github.actor != 'dependabot[bot]'
      uses: docker/login-action@v4.1.0
      with:
        registry: quay.io
        username: ${{ inputs.quay-username }}
        password: ${{ inputs.quay-token }}
    - name: Push Helm chart
      # Only run if dry run is explicitly set to 'false'
      # Dependabot triggered PRs don't have access to Quay credentials to push images, so no need to run in this case either
      if: inputs.dry-run == 'false' && ! (inputs.registry == 'quay' && github.actor == 'dependabot[bot]')
      shell: bash
      run: |

        # Push the Helm chart.
        echo "Pushing Helm chart "$PACKAGED_CHART" to ${{ env.AWS_REGISTRY }}${{ env.QUAY_REGISTRY }}"
        OUTPUT=$(helm push "$PACKAGED_CHART" ${{ env.AWS_REGISTRY }}${{ env.QUAY_REGISTRY }} 2>&1) || PUSH_FAILED=true
        echo "## Helm Push summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        if [[ "${PUSH_FAILED:-}" == "true" ]]; then
          echo "  ❌ Helm push failed — see output above"
          echo "  Chart: $PACKAGED_CHART"
          echo "  Registry: ${{ env.AWS_REGISTRY }}${{ env.QUAY_REGISTRY }}"
          exit 1
        fi
        echo "  ✅ Helm chart pushed successfully"

        # Capture the digest of the image that was pushed to enable signing.
        PUSHED=$(echo "$OUTPUT" | grep "^Pushed:" | awk '{print $2}')
        DIGEST=$(echo "$OUTPUT" | grep "^Digest:" | awk '{print $2}')
        :> "${{ env.REFS_FILE }}"
        printf "%s@%s\n" "$PUSHED" "$DIGEST" >> "${{ env.REFS_FILE }}"
      env:
        PACKAGED_CHART: "${{ runner.temp }}/packaged-chart/${{ inputs.app-name-prefix }}${{ inputs.app-name }}-${{ steps.chart-version.outputs.version }}.tgz"
        AWS_REGISTRY: ${{ inputs.registry == 'aws' && format('oci://{0}/charts' ,steps.login-ecr.outputs.registry) || '' }}
        QUAY_REGISTRY: ${{ inputs.registry == 'quay' && 'oci://quay.io/telicent/charts' || '' }}
        REFS_FILE: "${{ runner.temp }}/quay-chart-refs.txt"
    - name: Install CoSign
      # Only run if dry run is explicitly set to 'false' and the image is being pushed to 'quay'.
      if: inputs.dry-run == 'false' && inputs.registry == 'quay'
      uses: sigstore/cosign-installer@v3
    - name: Sign charts on Quay.io
      # Only run if dry run is explicitly set to 'false' and the image is being pushed to 'quay'.
      if: inputs.dry-run == 'false' && inputs.registry == 'quay'
      shell: bash
      run: |
        if [[ ! -s "${{ env.REFS_FILE }}" ]]; then
          echo "No pushed chart references found to sign"
          exit 1
        fi
        while IFS= read -r ref; do
          [[ -n "$ref" ]] || continue
          echo "signing $ref"
          cosign sign --yes "$ref"
        done < "${{ env.REFS_FILE }}"
      env:
        REFS_FILE: "${{ runner.temp }}/quay-chart-refs.txt"
