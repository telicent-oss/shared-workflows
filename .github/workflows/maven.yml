name: Maven Build

on:
  workflow_call:
    inputs:
      DOCKER_PROFILE:
        required: false
        type: string
        default: docker
        description: |
          Specifies the name of the profile that enables/disables Docker based tests.
      USES_DOCKERHUB_IMAGES:
        required: false
        type: boolean
        default: false
        description: |
          Specifies whether this build needs to pull images from DockerHub.
      PUBLIC_IMAGES:
        required: false
        type: string
        default: ""
        description: |
          Specifies a newline separated list of public image references that the build should pull
          and cache to speed up builds.

          Images are only pulled and cached on the specified `MAIN_BRANCH`, other branches will only
          restore the cache if it exists.
      MAVEN_ARGS:
        required: false
        type: string
        default: ""
        description: |
          Specifies any additional arguments to pass to the Maven invocations.
      MAVEN_DEBUG_ARGS:
        required: false
        type: string
        default: ""
        description: |
          Specifies any additional arguments to pass to the Maven invocations when the workflow is run in 
          debug mode.
      MAVEN_BUILD_GOALS:
        required: false
        type: string
        default: install
        description: |
          Specifies the Maven goal(s) to use when building the project.  Defaults to `install`.
      MAVEN_DEPLOY_GOALS:
        required: false
        type: string
        default: deploy
        description: |
          Specifies the Maven goal(s) to use when deploying the project, assuming `PUBLISH_SNAPSHOTS` was set to `true`
          and we're on the configured `MAIN_BRANCH`.  Defaults to `deploy`.
      MAVEN_REPOSITORY_ID:
        required: false
        type: string
        default: central
        description: |
          Specifies the ID of the repository to which `SNAPSHOT`s and Releases are published, this **MUST** match 
          the ID of a repository defined in the `pom.xml` for the project in order for credentials to be correctly 
          configured.
      JAVA_VERSION:
        required: false
        type: number
        default: 21
        description: |
          Specifies the JDK version to install and build with.  Defaults to 21.
      JDK:
        required: false
        type: string
        default: temurin
        description: |
          Specifies the JDK to use, defaults to `temurin`.
      MAIN_BRANCH:
        required: false
        type: string
        default: main
        description: |
          Specifies the main branch for the repository.

          Used in determining whether to pull and cache Docker images in conjunction with the `PUBLIC_IMAGES`
          parameter.
      PUBLISH_SNAPSHOTS:
        required: false
        type: boolean
        default: false
        description: |
          No longer supported.
      RUN_WINDOWS_BUILD:
        required: false
        type: boolean
        default: false
        description: |
          No longer supported.
      CHANGELOG_FILE:
        required: false
        type: string
        default: CHANGELOG.md
        description: |
          Specifies the Change Log file in the repository from which release notes can be extracted.
      RELEASE_FILES:
        required: false
        type: string
        description: |
          Specifies the release files that should be attached to the GitHub release.  For example a 
          downloadable package that is generated from the repository.  Regardless of this value we 
          will always attach the SBOMs to the release.
      PUBLISH_JACOCO_REPORT:
        required: false
        type: boolean
        default: false
        description: | 
          Specifies that Jacoco Code Coverage reports be published as part of the build.
      REMOTE_VEX:
        required: false
        type: string
        default: ""
        description: |
          Specifies a new line separated list of repository references from which remote VEX statements should be
          obtained and supplied to security scanners to filter out vulnerabilities.

          Generally only needed if your repository relies on other libraries that have applicable VEX statements.
      SONAR_QUALITY_GATE:
        required: false
        type: boolean
        default: true
        description: |
          Whether SonarQube runs at all in this workflow.  When true (the default) the scan is
          enforced on branch builds and reported without blocking on the main branch, see
          `SONAR_MODE` for the detail.  Set to false to skip the SonarQube job entirely.
      SONAR_MODE:
        required: false
        type: string
        default: ""
        description: |
          Overrides where the SonarQube Quality Gate is enforced.  One of:
          - `enforce`: fail the build on a failing Quality Gate, wherever it runs
          - `warn`: report a failing Quality Gate as a warning and a job summary entry, never failing the build
          - `off`: skip the SonarQube job entirely

          Left empty (the default) the mode is derived from the ref: `enforce` on branch builds,
          `warn` on the main branch and `release/*` branches, and `off` on tags, so that merges
          and release branch work are not blocked and tag workflows do not spend time re-running
          SonarQube. `SONAR_QUALITY_GATE: false` also forces `off`.

          Set `warn` explicitly while a project is being brought up to standard, in preference to
          disabling SonarQube outright.
    secrets:
      MVN_USER_NAME:
        required: false
        description: |
          Username for authenticating to a Maven repository to publish `SNAPSHOT`s, only needed if `SNAPSHOT`
          publishing is enabled.
      MVN_USER_PWD:
        required: false
        description: |
          Password/Token for authenticating to a Maven repository to publish `SNAPSHOT`s, only needed if `SNAPSHOT`
          publishing is enabled.
      DOCKER_READ_USER:
        required: false
        description: |
          Username for authenticating to DockerHub, only needed if `USES_DOCKERHUB_IMAGES` is set to true.
      DOCKER_READ_PWD:
        required: false
        description: |
          Password/Token for authenticating to DockerHub, only needed if `USES_DOCKERHUB_IMAGES` is set to true.
      GPG_PRIVATE_KEY:
        required: false
        description: |
          A GPG Private Key that will be used to sign the built artifacts during the build process.  The `pom.xml`
          **MUST** invoke the `maven-gpg-plugin` for this to have an effect.
      GPG_PASSPHRASE:
        required: false
        description: |
          The passphrase protecting the provided GPG Private Key.
      SONAR_HOST_URL:
        required: false
        description: |
          Base URL of the SonarQube server used for code quality scanning.  If not supplied
          the SonarQube scan and quality gate are skipped.
      SONAR_TOKEN:
        required: false
        description: |
          A SonarQube token with permission to analyse the project.  Required for the code
          quality scan to run, alongside `SONAR_HOST_URL`.

    outputs:
      version: 
        description: The detected Maven Version of the project as configured in the top level pom.xml
        value: ${{ jobs.build.outputs.version }}
      is-snapshot:
        description: Whether the Maven build was for a `SNAPSHOT` version.
        value: ${{ jobs.build.outputs.version != '' && contains(jobs.build.outputs.version, 'SNAPSHOT') }}
      
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  cache-dependencies:
    uses: telicent-oss/shared-workflows/.github/workflows/maven-cache-dependencies.yml@main
    with:
      JAVA_VERSION: ${{ inputs.JAVA_VERSION }}
      JDK: ${{ inputs.JDK }}

  cache-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        if: ${{ inputs.USES_DOCKERHUB_IMAGES && inputs.PUBLIC_IMAGES != '' && github.ref_name == inputs.MAIN_BRANCH }}
        with:
          username: ${{ secrets.DOCKER_READ_USER }}
          password: ${{ secrets.DOCKER_READ_PWD }}

      - name: Cache Docker Images
        uses: telicent-oss/docker-image-cache-action@v1
        if: ${{ inputs.PUBLIC_IMAGES != '' && github.ref_name == inputs.MAIN_BRANCH }}
        with:
          images: ${{ inputs.PUBLIC_IMAGES }}
          restore-only: false

  maven-central-audit:
    # Only run audit for OSS repositories that will be publishing to Maven Central
    # Also don't run for Dependabot PRs as Dependabot doesn't have access to the GPG secrets
    if: ${{ contains(github.repository_owner, 'oss') && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
    needs:
      - cache-dependencies
    uses: telicent-oss/shared-workflows/.github/workflows/maven-central-audit.yml@main
    with:
      MAVEN_REPOSITORY_ID: ${{ inputs.MAVEN_REPOSITORY_ID }}
      JAVA_VERSION: ${{ inputs.JAVA_VERSION }}
      JDK: ${{ inputs.JDK }}
      MAIN_BRANCH: ${{ inputs.MAIN_BRANCH }}
    secrets: inherit

  # Secrets cannot be referenced from a job-level 'if', so whether SonarQube is configured
  # is resolved in a job of its own and consumed via 'needs'.  The Quality Gate mode is
  # resolved here too, so the policy - what is enforced where - lives in one place.
  prepare-sonarqube:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check whether SonarQube is Configured
        id: sq-check
        run: |
          if [ -n "$SONAR_HOST_URL" ] && [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Resolve the Quality Gate mode
        id: sq-mode
        run: |
          if [ "$GATE_ENABLED" != "true" ]; then
            MODE=off
            REASON="SONAR_QUALITY_GATE is false"
          elif [ -n "$MODE_OVERRIDE" ]; then
            MODE="$MODE_OVERRIDE"
            REASON="SONAR_MODE was set explicitly"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            MODE=off
            REASON="this is a tag build, and release evidence comes from sonar-report-generation rather than a fresh build-time scan"
          elif [[ "$GITHUB_REF_NAME" == release/* ]]; then
            MODE=warn
            REASON="this is a release branch build, and release work must not be blocked by a code quality verdict"
          elif [ "$GITHUB_REF_NAME" = "$MAIN_BRANCH" ]; then
            MODE=warn
            REASON="this is a build of the main branch, and merges must not be blocked by a code quality verdict"
          else
            MODE=enforce
            REASON="this is a branch build, which is where the Quality Gate is enforced"
          fi
          echo "Quality Gate mode '$MODE': $REASON."
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        env:
          GATE_ENABLED: ${{ inputs.SONAR_QUALITY_GATE }}
          MODE_OVERRIDE: ${{ inputs.SONAR_MODE }}
          MAIN_BRANCH: ${{ inputs.MAIN_BRANCH }}
    outputs:
      is-configured: ${{ steps.sq-check.outputs.enabled }}
      quality-gate-mode: ${{ steps.sq-mode.outputs.mode }}

  build:
    needs:
      - cache-dependencies
      - cache-docker-images
      - prepare-sonarqube
    runs-on: ubuntu-latest
    env:
      # These have to be exported into the environment due to how the setup-java action configures the Maven
      # settings.xml file to avoid directly embedding credentials into it.
      MAVEN_USERNAME: ${{ secrets.MVN_USER_NAME }}
      MAVEN_PASSWORD: ${{ secrets.MVN_USER_PWD }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.project.outputs.version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6.0.2
        with:
          # To allow for commit tracing in SonarQube code quality checks
          fetch-depth: 0
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        if: ${{ inputs.USES_DOCKERHUB_IMAGES }}
        with:
          username: ${{ secrets.DOCKER_READ_USER }}
          password: ${{ secrets.DOCKER_READ_PWD }}

      - name: Restore Cached Docker Images
        if: ${{ inputs.PUBLIC_IMAGES != '' }}
        uses: telicent-oss/docker-image-cache-action@v1
        with:
          images: ${{ inputs.PUBLIC_IMAGES }}
          restore-only: ${{ github.ref_name != inputs.MAIN_BRANCH }}

      - name: Install Java and Maven
        uses: actions/setup-java@v5.4.0
        with:
          java-version: ${{ inputs.JAVA_VERSION }}
          distribution: ${{ inputs.JDK }}
          cache: maven
          server-id: ${{ inputs.MAVEN_REPOSITORY_ID }}
          # Forced to use indirection here, the setup-java action configures the Maven settings.xml to reference
          # the credentials via environment variables
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Check whether GPG Signing is Enabled
        id: gpg-check
        run: |
          if [ "${{ secrets.GPG_PRIVATE_KEY }}" != "" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key
        if: ${{ steps.gpg-check.outputs.enabled == 'true' }}
        uses: crazy-max/ghaction-import-gpg@v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate Extra Maven Arguments (if needed)
        id: extra-maven-args
        if: ${{ steps.gpg-check.outputs.enabled == 'false' }}
        shell: bash
        run: |
          echo "args=-Dgpg.skip=true" >> "$GITHUB_OUTPUT"

      - name: Check whether any Java code changed
        id: java-changes
        uses: rvesse/detect-changes-action@v1
        with:
          base: ${{ inputs.MAIN_BRANCH }}
          pattern: src/|pom.xml
          flags: -E
          # Ensures we always run tests when building on main
          output-on-base: true
          summary: false
          notices: false

      - name: Build and Verify Maven Package
        # NB - If we don't detect any Java code or Maven metadata changes then we skipTests
        #      This lets builds run faster if developers are only updating docs, Helm Charts, Dockerfile's etc and not
        #      changing the Java code itself
        # Note that we also skip CycloneDX SBOM generation as that can be expensive and we don't need SBOMs at this
        # stage of the workflow, they'll get generated later for security scans and/or release publishing
        run: |
          if [ "${{ runner.debug }}" -eq 1 ] 2>/dev/null; then
            mvn ${{ inputs.MAVEN_BUILD_GOALS }} --batch-mode -P${{ inputs.DOCKER_PROFILE }} ${{ case(steps.java-changes.outputs.changed == 'false', '-DskipTests', '') }} -Dcyclonedx.skip ${{ inputs.MAVEN_ARGS }} ${{ inputs.MAVEN_DEBUG_ARGS }} ${{ steps.extra-maven-args.outputs.args }}
          else
            mvn ${{ inputs.MAVEN_BUILD_GOALS }} --batch-mode -P${{ inputs.DOCKER_PROFILE }} ${{ case(steps.java-changes.outputs.changed == 'false', '-DskipTests', '') }} -Dcyclonedx.skip ${{ inputs.MAVEN_ARGS }} ${{ steps.extra-maven-args.outputs.args }}
          fi

      - name: Trivy Vulnerability Scanning
        id: trivy-scan
        uses: telicent-oss/trivy-action@v1
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          scan-type: fs
          scan-name: maven
          scan-ref: .
          remote-vex: |
            telicent-oss/telicent-base-images
            ${{ inputs.REMOTE_VEX }}

      - name: Upload JaCoCo Report
        # Also uploaded when SonarQube is configured, since the scan now runs in its own
        # job and needs the coverage this job produced
        if: ${{ inputs.PUBLISH_JACOCO_REPORT || needs.prepare-sonarqube.outputs.is-configured == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: |
            target/site/jacoco/
            **/target/site/jacoco/

      - name: Detect Maven version
        id: project
        run: |
          echo version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec) >> $GITHUB_OUTPUT

  # SonarQube runs as its own job rather than as a step in 'build', so that a code quality
  # verdict can never fail the job that produces the artifacts, sets the version output and
  # gates the release.  This mirrors parallel-maven.yml.  Nothing depends on this job.
  sonarqube-code-scan:
    name: Scan code with sonarqube
    runs-on: ubuntu-latest
    needs:
      - prepare-sonarqube
      - build
    permissions:
      contents: read
    # Dependabot only ever bumps dependency declarations, and release-please release
    # commits only bump versions and changelogs, so neither can change a Quality Gate
    # outcome.  Skipping them avoids a scan, and a wait for the verdict, that cannot tell
    # us anything - and in release-please's case avoids a release commit being the thing
    # that reports a pre-existing quality problem.
    if: >-
      ${{ needs.prepare-sonarqube.outputs.is-configured == 'true'
          && needs.prepare-sonarqube.outputs.quality-gate-mode != 'off'
          && github.actor != 'dependabot[bot]'
          && !startsWith(github.event.head_commit.message, 'chore(main): release') }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6.0.2
        with:
          # To allow for commit tracing in SonarQube code quality checks
          fetch-depth: 0

      - name: Install Java and Maven
        uses: actions/setup-java@v5.4.0
        with:
          java-version: ${{ inputs.JAVA_VERSION }}
          distribution: ${{ inputs.JDK }}
          cache: maven

      - name: Check whether any Java code changed
        id: java-changes
        uses: rvesse/detect-changes-action@v1
        with:
          base: ${{ inputs.MAIN_BRANCH }}
          pattern: src/|pom.xml
          flags: -E
          # Deliberately NOT output-on-base here.  The build job forces this true on the
          # base branch so that tests always run on main, but there is no equivalent
          # reason to re-analyse main when nothing under src/ or pom.xml changed.
          output-on-base: false
          summary: false
          notices: false

      - name: Download coverage reports
        if: ${{ steps.java-changes.outputs.changed == 'true' }}
        # Tolerated: a project with no JaCoCo output produces no artifact to download.
        # Missing coverage degrades the analysis, it should not fail the scan.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: jacoco-report
          path: sonar-coverage

      - name: Sonarqube code quality check
        id: code-quality
        if: ${{ steps.java-changes.outputs.changed == 'true' }}
        uses: telicent-oss/shared-workflows/.github/actions/mvn-sast-scanning@main
        with:
          sonar-host-url: ${{ secrets.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          # This job did not build, so the Java analyser has no bytecode to work from
          compile: 'true'
          coverage-report-paths: ${{ github.workspace }}/sonar-coverage/**/jacoco.xml
          maven-args: ${{ inputs.MAVEN_ARGS }}
          maven-profiles: ${{ inputs.DOCKER_PROFILE }}
          quality-gate: ${{ needs.prepare-sonarqube.outputs.quality-gate-mode }}

      - name: Publish SonarQube Dashboard Link
        if: ${{ !cancelled() && steps.code-quality.outputs.dashboard-url != '' }}
        run: |
          echo "### [SonarQube dashboard](${{ steps.code-quality.outputs.dashboard-url }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Detect Maven version
        id: project
        run: |
          echo version=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec) >> $GITHUB_OUTPUT

  github-release:
    needs: build
    if: ${{ github.ref_type == 'tag' && needs.build.outputs.version != '' && !contains(needs.build.outputs.version, 'SNAPSHOT') }}
    uses: telicent-oss/shared-workflows/.github/workflows/maven-github-release.yml@main
    with:
      CHANGELOG_FILE: ${{ inputs.CHANGELOG_FILE }}
      DOCKER_PROFILE: ${{ inputs.DOCKER_PROFILE }}
      JAVA_VERSION: ${{ inputs.JAVA_VERSION }}
      JDK: ${{ inputs.JDK }}
      MAVEN_ARGS: ${{ inputs.MAVEN_ARGS }}
      MAVEN_DEBUG_ARGS: ${{ inputs.MAVEN_DEBUG_ARGS }}
      MAVEN_DEPLOY_GOALS: ${{ inputs.MAVEN_DEPLOY_GOALS }}
    secrets: inherit
