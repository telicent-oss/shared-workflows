name: Maven Cache Dependencies

on:
  workflow_call:
    inputs:
      JAVA_VERSION:
        required: false
        type: number
        default: 21
        description: |
          Specifies the JDK version to install and build with.  Defaults to 21.
      JDK:
        required: false
        type: string
        default: temurin
        description: |
          Specifies the JDK to use, defaults to `temurin`.
      
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  cache-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6.0.2

      - name: Install Java and Maven
        uses: actions/setup-java@v6.3.0
        with:
          java-version: ${{ inputs.JAVA_VERSION }}
          distribution: ${{ inputs.JDK }}
          cache: maven
          # We intentionally don't configure credentials for the cache dependencies step.  Any dependencies MUST
          # be in the public artifact repository so fail fast if a project is still relying on private dependencies
          # that have not been published.
          # This fixes a bug seen where some builds go very slow because a JBoss dependency declares the public
          # JBoss repository which causes Maven to try and resolve dependencies there which don't exist leading to
          # 5xx errors and backoff retry slowing the build
          mvn-mirrors: |
            central:https://repo.maven.apache.org/maven2:jboss-public-repository-group

      - name: Cache Maven Dependencies
        run: |
          mvn dependency:go-offline --batch-mode
